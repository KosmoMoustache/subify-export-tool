[project]
name = "subify"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "KosmoMoustache" }]
requires-python = ">=3.11"
dependencies = ["questionary>=2.1.1", "requests>=2.34.2"]

[project.scripts]
subify = "subify:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pre-commit>=4.7.0", "pytest>=9.2.0", "ruff>=0.17.4", "ty>=0.0.100"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88
force-exclude = true
extend-exclude = [
    "legacy",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
